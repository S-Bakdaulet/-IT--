<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Мои курсы и группы — IT Academy</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="/index.html">IT-Professions</a>
      <nav><ul>
        <li><a href="/index.html">← На сайт</a></li>
        <li><button class="button button--small button--ghost" type="button" id="logout">Выйти</button></li>
      </ul></nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h2 style="text-align:left" id="hello">Мои курсы и группы</h2>
      <p class="section__lead" style="text-align:left;margin-left:0" id="meta">Загрузка…</p>
      <div class="form-status" id="msg" role="status" aria-live="polite" style="text-align:left"></div>
      <div class="stats" id="tiles" style="margin-bottom:28px"></div>

      <div class="panel" id="weekPanel" hidden>
        <h3>Расписание недели</h3>
        <div class="week" id="week"></div>
        <p class="note" id="weekNote" style="text-align:left" hidden></p>
      </div>

      <div id="groups"></div>
    </div>
  </main>

  <script src="/auth.js"></script>
  <script>
  (function () {
    'use strict';
    var $ = function (s) { return document.querySelector(s); };
    var STATUS = { pending: 'Ожидает', approved: 'Записан' };
    var PAY = { unpaid: 'Не оплачено', pending: 'В ожидании', paid: 'Оплачено' };

    function h(tag, props, kids) {
      var e = document.createElement(tag);
      Object.keys(props || {}).forEach(function (k) { if (k === 'class') e.className = props[k]; else if (k === 'text') e.textContent = props[k]; else e[k] = props[k]; });
      [].concat(kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
      return e;
    }
    function td(tr, content) { var c = h('td', {}, content === undefined ? [] : [content]); tr.appendChild(c); return c; }
    function date(s) { var d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('ru-RU'); }
    function plural(n, a, b, c) { var m = n % 100, k = n % 10; return n + ' ' + (m > 10 && m < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c); }

    var DAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
    function parseDays(text) {
      return DAYS.map(function (d, i) { return new RegExp('(^|[^А-Яа-яЁё])' + d + '(?![А-Яа-яЁё])').test(text) ? i : -1; }).filter(function (i) { return i >= 0; });
    }
    function parseTime(text) { var m = text.match(/\d{1,2}[:.]\d{2}/); return m ? m[0].replace('.', ':').replace(/^(\d):/, '0$1:') : ''; }
    function startInfo(iso) {
      var d = new Date(iso + 'T00:00:00'), t = new Date(); t.setHours(0, 0, 0, 0);
      var diff = Math.round((d - t) / 86400000);
      if (isNaN(diff)) return { text: '', cls: '' };
      if (diff > 0) return { text: 'старт через ' + plural(diff, 'день', 'дня', 'дней'), cls: 'pill--pending' };
      return { text: diff === 0 ? 'старт сегодня' : 'идёт', cls: 'pill--approved' };
    }
    function count(g, status) { return g.students.filter(function (s) { return s.status === status; }).length; }

    // Описание и ссылка на платформу — из публичного /api/courses (в /api/teacher/overview их нет); сопоставление по id курса
    var catalog = {};
    function platformName(c) { return /stepik/i.test((c.provider || '') + ' ' + (c.external_url || '')) ? 'Stepik' : (c.provider || 'внешний сайт'); }
    function platformLink(c) {
      if (!c || !/^https?:\/\//i.test(c.external_url || '')) return null;
      return h('a', { class: 'platform-btn', href: c.external_url, target: '_blank', rel: 'noopener noreferrer', text: 'Перейти на платформу (' + platformName(c) + ') ↗' });
    }

    function allGroups(courses) {
      return courses.reduce(function (acc, c) { return acc.concat(c.groups.map(function (g) { g.course_title = g.course_title || c.course_title; return g; })); }, []);
    }

    function renderTiles(t) {
      var tiles = $('#tiles'); tiles.textContent = '';
      [['Курсов', t.courses], ['Групп', t.groups], ['Студентов', t.students], ['Записано', t.approved], ['Оплатили', t.paid]].forEach(function (x) {
        tiles.appendChild(h('div', { class: 'tile' }, [h('div', { class: 'stat__number', text: String(x[1]) }), h('div', { class: 'stat__label', text: x[0] })]));
      });
    }

    // недельная сетка: дни и время берутся из текста расписания («Пн/Ср/Пт 18:00»)
    function renderWeek(groups) {
      if (!groups.length) return;
      var cols = DAYS.map(function () { return []; }), loose = [];
      groups.forEach(function (g) {
        var days = parseDays(g.schedule_time);
        if (!days.length) { loose.push(g); return; }
        days.forEach(function (d) { cols[d].push({ g: g, time: parseTime(g.schedule_time) }); });
      });
      var week = $('#week'); week.textContent = '';
      DAYS.forEach(function (name, i) {
        var col = h('div', { class: 'week__day' + (cols[i].length ? ' week__day--on' : '') }, [h('h4', { text: name })]);
        cols[i].sort(function (a, b) { return a.time < b.time ? -1 : 1; }).forEach(function (it) {
          col.appendChild(h('a', { class: 'week__item', href: '#group-' + it.g.id }, [h('b', { text: it.time || 'время —' }), it.g.course_title]));
        });
        week.appendChild(col);
      });
      if (loose.length) {
        var n = $('#weekNote'); n.hidden = false;
        n.textContent = 'Без привязки к дням недели: ' + loose.map(function (g) { return g.course_title + ' — ' + g.schedule_time; }).join('; ');
      }
      $('#weekPanel').hidden = false;
    }

    function studentsTable(g) {
      if (!g.students.length) return h('p', { class: 'note', style: 'text-align:left', text: 'В этой группе пока нет студентов.' });
      var head = h('tr', {}, ['№', 'Студент', 'Телефон', 'Почта', 'Уровень', 'Статус', 'Оплата'].map(function (t) { return h('th', { text: t }); }));
      var body = h('tbody');
      g.students.forEach(function (s, i) {
        var tr = h('tr');
        td(tr, String(i + 1)); td(tr, s.name);
        td(tr, s.phone ? h('a', { href: 'tel:' + s.phone.replace(/[^\d+]/g, ''), text: s.phone }) : '—');
        td(tr, h('a', { href: 'mailto:' + s.email, text: s.email }));
        td(tr, s.level || '—');
        td(tr, h('span', { class: 'pill pill--' + s.status, text: STATUS[s.status] || s.status }));
        td(tr, h('span', { class: 'pill pill--' + (s.payment_status === 'pending' ? 'payment-pending' : s.payment_status), text: PAY[s.payment_status] || s.payment_status }));
        body.appendChild(tr);
      });
      return h('div', { class: 'table-wrap' }, [h('table', { class: 'table' }, [h('thead', {}, [head]), body])]);
    }

    function groupCard(g) {
      var st = startInfo(g.start_date);
      var card = h('div', { class: 'group-card', id: 'group-' + g.id });
      card.appendChild(h('div', { class: 'group-card__head' }, [
        h('h4', { text: 'Группа №' + g.id + ' · ' + g.schedule_time }),
        h('span', { class: 'pill pill--approved', text: 'Записано: ' + count(g, 'approved') + ' из ' + g.max_students })
      ]));
      card.appendChild(h('p', { class: 'muted' }, [
        'старт ' + date(g.start_date) + ' · ожидают: ' + count(g, 'pending') + ' ',
        h('span', { class: 'pill ' + st.cls, text: st.text })
      ]));
      card.appendChild(studentsTable(g));
      return card;
    }

    function render(data) {
      var root = $('#groups'); root.textContent = '';
      if (!data.courses.length) {
        root.appendChild(h('div', { class: 'group-card' }, [h('p', { class: 'muted', text: 'Вам пока не назначено ни одного курса. Обратитесь к администратору.' })]));
        return;
      }
      data.courses.forEach(function (c) {
        var info = catalog[c.course_id] || {};
        var block = h('section', { class: 'course-block', id: 'course-' + c.course_id });
        var left = h('div', {}, [
          h('h3', { text: c.course_title }),
          h('span', { class: 'muted', text: [c.duration ? 'Длительность: ' + c.duration : '', plural(c.groups.length, 'группа', 'группы', 'групп')].filter(Boolean).join(' · ') })
        ]);
        if (info.description) left.appendChild(h('p', { class: 'course-block__desc', text: info.description }));
        var head = h('div', { class: 'course-block__head' }, [left]);
        var link = platformLink(info);
        if (link) head.appendChild(link);
        block.appendChild(head);
        c.groups.forEach(function (g) { block.appendChild(groupCard(g)); });
        root.appendChild(block);
      });
    }

    $('#logout').addEventListener('click', function () { Auth.logout().then(function () { location.href = '/teacher'; }); });

    Auth.me().then(function (u) {
      if (!u || u.role !== 'teacher') { location.href = '/teacher'; return; }
      $('#hello').textContent = 'Здравствуйте, ' + u.name.split(' ')[0] + '!';
      return Promise.all([
        Auth.call('/api/teacher/overview'),
        Auth.courses().catch(function () { return []; })
      ]).then(function (res) {
        var data = res[0].data;
        res[1].forEach(function (c) { catalog[c.id] = c; });
        var t = data.totals;
        $('#meta').textContent = plural(t.courses, 'курс', 'курса', 'курсов') + ', ' + plural(t.groups, 'группа', 'группы', 'групп') + ', ' + plural(t.students, 'студент', 'студента', 'студентов') + '. Показаны только ваши курсы и группы.';
        renderTiles(t);
        renderWeek(allGroups(data.courses));
        render(data);
      });
    }).catch(function (e) {
      $('#meta').textContent = '';
      var m = $('#msg'); m.textContent = e.status === 401 || e.status === 403 ? 'Сессия закончилась. Войдите снова.' : e.message; m.className = 'form-status error';
      if (e.status === 401 || e.status === 403) setTimeout(function () { location.href = '/teacher'; }, 1200);
    });
  })();
  </script>
</body>
</html>
